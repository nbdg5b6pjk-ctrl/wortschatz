<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d6f63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Wortschatz Üben</title>
<style>
:root{
  --paper:#f4f6f4; --card:#ffffff; --ink:#15302f; --muted:#5d7270; --line:#d3dcd8;
  --accent:#0d6f63; --accent-ink:#ffffff; --chip:#e8eeeb;
  --ok:#2f8f3a; --ok-bg:#e3f4e3; --bad:#c43c3c; --bad-bg:#fbe6e6; --sel:#1f6fd1; --sel-bg:#e3eefc;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e1716; --card:#15211f; --ink:#e3ece9; --muted:#93a7a3; --line:#2a3b38;
  --accent:#4cc3ad; --accent-ink:#06201b; --chip:#1d2b29;
  --ok:#7bd88a; --ok-bg:#183322; --bad:#ff8a8a; --bad-bg:#3a1b1d; --sel:#7fb2ff; --sel-bg:#16283f; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1716; --card:#15211f; --ink:#e3ece9; --muted:#93a7a3; --line:#2a3b38;
  --accent:#4cc3ad; --accent-ink:#06201b; --chip:#1d2b29;
  --ok:#7bd88a; --ok-bg:#183322; --bad:#ff8a8a; --bad-bg:#3a1b1d; --sel:#7fb2ff; --sel-bg:#16283f; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--sans);font-size:16px;line-height:1.35;-webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 32px;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{color:var(--accent);text-decoration:none;font-weight:600;font-size:.95rem;white-space:nowrap}
h1{font-family:var(--serif);font-size:1.3rem;margin:0;font-weight:600}
h1 span{color:var(--accent)}
.bar{display:flex;align-items:center;gap:10px;margin:14px 0 6px}
.prog{flex:1;height:12px;border-radius:99px;background:var(--chip);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .35s ease}
.combo{font-weight:700;font-size:.85rem;color:var(--accent);min-width:74px;text-align:right;font-variant-numeric:tabular-nums}
.opts{display:flex;gap:8px;align-items:center;margin:4px 0 2px}
.opts select{flex:1;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:.9rem}
h2{font-size:1.35rem;margin:18px 0 14px;font-weight:700}
.board{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{display:flex;flex-direction:column;gap:12px}
.tile{min-height:68px;padding:10px 10px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--card);
  display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.02rem;cursor:pointer;
  -webkit-tap-highlight-color:transparent;user-select:none;transition:background .15s,border-color .15s,opacity .3s,transform .08s;word-break:break-word;hyphens:auto}
.tile:active{transform:translateY(2px)}
.tile.sel{border-color:var(--sel);background:var(--sel-bg);color:var(--sel)}
.tile.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.tile.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);animation:shake .35s}
.tile.done{opacity:.35;cursor:default;border-color:var(--line);background:transparent;color:var(--muted);pointer-events:none}
.tile.long{font-size:.88rem}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.foot{margin-top:auto;padding-top:22px}
.msg{min-height:26px;font-weight:700;font-size:1.1rem;color:var(--ok);margin-bottom:10px}
.msg.miss{color:var(--muted);font-weight:500;font-size:.9rem}
.go{width:100%;border:0;border-radius:14px;padding:15px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  background:var(--accent);color:var(--accent-ink);cursor:pointer;border-bottom:4px solid rgba(0,0,0,.18)}
.go:disabled{background:var(--chip);color:var(--muted);border-bottom-color:transparent;cursor:default}
.stats{display:flex;justify-content:space-between;color:var(--muted);font-size:.82rem;margin-top:12px;font-variant-numeric:tabular-nums}
.review{margin-top:14px;font-size:.88rem;color:var(--muted)}
.review b{color:var(--ink)}
.empty{color:var(--muted);text-align:center;margin:40px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="./" id="back">← Wörterbuch</a>
    <h1>Wortschatz <span>üben</span></h1>
  </header>
  <div class="bar"><div class="prog"><i id="prog"></i></div><div class="combo" id="combo"></div></div>
  <div class="opts">
    <select id="src" aria-label="Words to practise"></select>
  </div>
  <h2>Tap the matching pairs</h2>
  <div id="board" class="board"><p class="empty" style="grid-column:1/-1">Loading your words…</p></div>
  <div class="foot">
    <div class="msg" id="msg"></div>
    <button class="go" id="next" disabled>Continue</button>
    <div class="stats"><span id="st1"></span><span id="st2"></span></div>
    <div class="review" id="review"></div>
  </div>
</div>
<script>
(function(){
const $=id=>document.getElementById(id);
const THEMES=[["food","Food & drink"],["home","Home & household"],["city","City & shopping"],["travel","Travel & transport"],["body","Body & health"],["clothing","Clothing & accessories"],["nature","Nature & animals"],["time","Time, weather & holidays"],["feelings","Feelings & character"],["culture","Culture & leisure"],["general","Everyday words"],["a","Conjunctions & adverbs"],["h","Greetings & phrases"],["f","Family"],["b","Admin, business & IT"],["s","School & study"],["p","Sport"]];
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

// In the home-screen app stay in the same window; in a normal browser tab "back" closes/returns.
if(!(window.navigator.standalone||matchMedia("(display-mode: standalone)").matches)&&window.opener){
  $("back").addEventListener("click",e=>{e.preventDefault();try{window.close()}catch(_){}; location.href="./"});
}

let ALL=[], POOL=[], round=[], left=[], right=[], pick=null, matched=0, combo=0, best=store.get("wz-pr-best",0);
let rounds=store.get("wz-pr-rounds",0), missed=store.get("wz-pr-missed",{}), roundMiss=new Set();

const short=s=>s.length<=34;
function clean(e){return e.replace(/\s*\((colloquial|pejorative|formal|ironic|proverb|literary|law|f|m|verb|adj\.?|n)\)\s*/gi," ").replace(/\s+/g," ").trim()}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}

function build(data){
  const seen=new Set();
  data.forEach((r,i)=>{
    if(!r||!r.e||!r.d||!r.d.length)return;
    const de=r.d[0].trim(), en=clean(r.e.split(/;\s*/)[0]);
    if(!de||!en||!short(de)||!short(en))return;
    const k=de.toLowerCase();
    if(seen.has(k))return; seen.add(k);
    ALL.push({de,en:cap(en),t:r.t,i});
  });
}

function setupSources(){
  const sel=$("src"), n=ALL.length;
  const opts=[["all","All words · "+n.toLocaleString("de-CH")],["recent","Recently added (last 300)"],["missed","Words I got wrong"]]
    .concat(THEMES.map(t=>{const c=ALL.filter(w=>w.t===t[0]).length;return c>=5?["t:"+t[0],t[1]+" · "+c]:null}).filter(Boolean));
  sel.innerHTML=opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join("");
  const saved=store.get("wz-pr-src","recent");
  sel.value=opts.some(o=>o[0]===saved)?saved:"recent";
  sel.onchange=()=>{store.set("wz-pr-src",sel.value);choosePool();newRound()};
  choosePool();
}
function choosePool(){
  const v=$("src").value;
  if(v==="all")POOL=ALL;
  else if(v==="recent")POOL=ALL.slice(-300);
  else if(v==="missed"){POOL=ALL.filter(w=>missed[w.de]);if(POOL.length<5)POOL=POOL.concat(ALL.slice(-300).filter(w=>!missed[w.de]))}
  else POOL=ALL.filter(w=>w.t===v.slice(2));
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

function newRound(){
  // Weight words you got wrong more heavily; never repeat an English or German text in one round
  const weighted=[];POOL.forEach(w=>{weighted.push(w);if(missed[w.de])weighted.push(w,w)});
  const pickd=[],en=new Set(),de=new Set();
  for(const w of shuffle(weighted)){
    if(pickd.length===5)break;
    const ke=w.en.toLowerCase(),kd=w.de.toLowerCase();
    if(en.has(ke)||de.has(kd))continue;
    en.add(ke);de.add(kd);pickd.push(w);
  }
  round=pickd; matched=0; pick=null; roundMiss=new Set();
  left=shuffle(round); right=shuffle(round);
  render();
  $("msg").textContent="";$("msg").className="msg";$("next").disabled=true;$("next").textContent="Continue";$("review").innerHTML="";
  updateBar();
}
function tile(w,side){
  const txt=side==="L"?w.en:w.de;
  return `<div class="tile${txt.length>18?" long":""}" role="button" tabindex="0" data-side="${side}" data-k="${encodeURIComponent(w.de)}" lang="${side==="L"?"en":"de"}">${txt.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</div>`;
}
function render(){
  if(round.length<5){$("board").innerHTML='<p class="empty" style="grid-column:1/-1">Not enough words here yet. Pick another list.</p>';return}
  $("board").innerHTML=`<div class="col">${left.map(w=>tile(w,"L")).join("")}</div><div class="col">${right.map(w=>tile(w,"R")).join("")}</div>`;
}
function updateBar(){
  $("prog").style.width=(matched/5*100)+"%";
  $("combo").textContent=combo>=2?"COMBO ×"+combo:"";
  $("st1").textContent="Rounds: "+rounds;
  $("st2").textContent="Best combo: "+best;
}
function speak(text,lang){try{if(!("speechSynthesis" in window))return;const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.95;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

$("board").addEventListener("click",e=>{
  const t=e.target.closest(".tile");if(!t||t.classList.contains("done"))return;
  if(t.dataset.side==="R")speak(t.textContent,"de-DE");
  if(!pick){pick=t;t.classList.add("sel");return}
  if(pick===t){t.classList.remove("sel");pick=null;return}
  if(pick.dataset.side===t.dataset.side){pick.classList.remove("sel");pick=t;t.classList.add("sel");return}
  const a=pick,b=t;pick=null;a.classList.remove("sel");
  if(a.dataset.k===b.dataset.k){
    [a,b].forEach(x=>x.classList.add("ok"));
    setTimeout(()=>[a,b].forEach(x=>{x.classList.remove("ok");x.classList.add("done")}),380);
    matched++;combo++;if(combo>best){best=combo;store.set("wz-pr-best",best)}
    const k=decodeURIComponent(a.dataset.k);
    if(missed[k]&&!roundMiss.has(k)){missed[k]--;if(missed[k]<=0)delete missed[k];store.set("wz-pr-missed",missed)}
    if(matched===5)finish();
  }else{
    [a,b].forEach(x=>x.classList.add("bad"));
    setTimeout(()=>[a,b].forEach(x=>x.classList.remove("bad")),450);
    combo=0;
    // Remember both words involved so they come back more often
    [a,b].forEach(x=>{const k=decodeURIComponent(x.dataset.k);if(!roundMiss.has(k)){roundMiss.add(k);missed[k]=Math.min((missed[k]||0)+2,6)}});
    store.set("wz-pr-missed",missed);
  }
  updateBar();
});
$("board").addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("tile")){e.preventDefault();e.target.click()}});

function finish(){
  rounds++;store.set("wz-pr-rounds",rounds);
  const praise=["Excellent!","Super!","Prima!","Sehr gut!","Toll!","Klasse!"];
  $("msg").textContent=roundMiss.size?"Geschafft!":praise[Math.random()*praise.length|0];
  if(roundMiss.size){
    const ws=round.filter(w=>roundMiss.has(w.de));
    $("review").innerHTML="To review: "+ws.map(w=>`<b>${w.de}</b> – ${w.en}`).join(" · ");
  }
  $("next").disabled=false;$("next").focus();updateBar();
}
$("next").onclick=()=>{choosePool();newRound()};

// Load the dictionary from the main page (cached for offline use), plus words saved on this device
fetch("index.html",{cache:"no-cache"}).then(r=>r.text()).then(html=>{
  const m=html.match(/<script id="data" type="application\/json">([\s\S]*?)<\/script>/);
  const data=m?JSON.parse(m[1]):[];
  const local=store.get("wz-local",[]);
  build(data.concat(Array.isArray(local)?local:[]));
  if(!ALL.length){$("board").innerHTML='<p class="empty" style="grid-column:1/-1">Couldn’t load your words. Open the dictionary once while online.</p>';return}
  setupSources();newRound();
}).catch(()=>{$("board").innerHTML='<p class="empty" style="grid-column:1/-1">Couldn’t load your words. Open the dictionary once while online.</p>'});

if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).catch(()=>{});
})();
</script>
</body>
</html>
